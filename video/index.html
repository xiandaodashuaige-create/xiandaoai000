<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>鹿联 AI 营销视频员工</title>
<meta name="description" content="丢进素材，说一句需求，鹿联 AI 帮你做营销视频。">
<style>
:root{
  --bg:#07120e;--panel:#0d1d17;--line:#234437;--text:#f6faf7;
  --muted:#9db0a5;--green:#35d07f;--green2:#b3f6cd;--yellow:#ffd767;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:
radial-gradient(circle at 75% 0,#173b2c 0,transparent 35%),
linear-gradient(180deg,#07120e,#08150f 55%,#06100c);
color:var(--text);font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
button,input,textarea,select{font:inherit}
a{color:inherit}
.page{max-width:900px;margin:auto;padding:26px 18px 80px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:56px}
.brand{font-weight:900;letter-spacing:.12em;color:var(--green2);font-size:13px}
.smallbtn{border:1px solid var(--line);background:#0d1b15;color:#dff5e7;border-radius:11px;padding:9px 12px;cursor:pointer}
.hero{text-align:center;margin-bottom:28px}
.hero h1{font-size:clamp(34px,7vw,56px);line-height:1.08;margin:0 0 14px;letter-spacing:-1.8px}
.hero p{color:var(--muted);font-size:15px;line-height:1.7;margin:0}
.composer{background:rgba(13,29,23,.95);border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:0 28px 80px #0005}
.drop{border:1px dashed #3c7559;background:#081610;border-radius:18px;min-height:150px;display:grid;place-items:center;text-align:center;padding:20px;transition:.2s;cursor:pointer}
.drop.drag{border-color:var(--green);background:#0b2017}
.plus{width:46px;height:46px;border-radius:15px;background:#153627;display:grid;place-items:center;margin:0 auto 10px;font-size:28px;color:var(--green2)}
.drop b{display:block;font-size:16px;margin-bottom:5px}
.drop span{font-size:12px;color:var(--muted);line-height:1.6}
#fileInput{display:none}
.files{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}
.file{display:flex;gap:7px;align-items:center;background:#10251b;border:1px solid #254738;padding:7px 10px;border-radius:999px;font-size:12px;color:#dce9e1;max-width:100%}
.file em{font-style:normal;color:#8da095;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.file button{border:0;background:transparent;color:#8da095;cursor:pointer;padding:0;font-size:16px}
.ask{margin-top:14px;position:relative}
textarea{width:100%;min-height:124px;resize:vertical;border:0;outline:0;border-radius:16px;background:#07140f;color:white;padding:16px 16px 48px;line-height:1.65;font-size:15px}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0}
.chip{border:1px solid #295140;background:#0c2017;color:#cce2d5;padding:7px 10px;border-radius:999px;font-size:12px;cursor:pointer}
.actions{display:flex;gap:10px;align-items:center;margin-top:15px}
.primary{flex:1;border:0;background:linear-gradient(135deg,#3bd785,#24b26b);color:#03150c;border-radius:14px;padding:15px 18px;font-weight:900;font-size:16px;cursor:pointer}
.primary:disabled{opacity:.45;cursor:not-allowed}
.advanced{margin-top:12px;border-top:1px solid #1f3a2f;padding-top:10px}
.advanced summary{cursor:pointer;color:#91a89b;font-size:12px;list-style:none}
.advanced summary::-webkit-details-marker{display:none}
.advbody{display:flex;gap:14px;flex-wrap:wrap;padding-top:12px}
.field{flex:1;min-width:180px}
.field label{display:block;font-size:11px;color:#8fa296;margin-bottom:6px}
select,input.text{width:100%;border:1px solid #28493b;background:#07140f;color:white;border-radius:10px;padding:10px}
.notice{display:none;margin-top:14px;background:#081610;border:1px solid #234336;border-radius:14px;padding:14px}
.notice.show{display:block}
.notice .line{display:flex;justify-content:space-between;gap:15px;font-size:13px}
.notice .muted{color:var(--muted)}
.progress{height:7px;background:#15281f;border-radius:999px;overflow:hidden;margin-top:10px}
.bar{height:100%;width:0;background:var(--green);transition:.25s}
.history{margin-top:26px}
.history summary{cursor:pointer;color:#b9c9c0;font-weight:800}
.jobs{margin-top:10px;border:1px solid var(--line);border-radius:16px;padding:0 14px;background:#091811}
.job{padding:13px 0;border-bottom:1px solid #1f392e}
.job:last-child{border:0}
.jobhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.jobhead b{font-size:13px}
.pill{font-size:11px;background:#153326;color:var(--green2);padding:4px 8px;border-radius:999px}
.meta{color:#8fa197;font-size:11px;margin-top:5px;line-height:1.5}
.result{display:inline-block;margin-top:8px;text-decoration:none;background:#92ecb4;color:#062012;padding:7px 10px;border-radius:9px;font-size:12px;font-weight:800}
.empty{color:#82958a;font-size:12px;padding:14px 0}
.modal{position:fixed;inset:0;background:#020a078d;backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;padding:18px;z-index:20}
.modal.show{display:flex}
.box{width:min(420px,100%);background:#0d1d17;border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 30px 80px #0008}
.box h2{margin:0 0 7px;font-size:21px}
.box p{margin:0 0 16px;color:var(--muted);font-size:12px;line-height:1.6}
.box input{width:100%;background:#07140f;color:white;border:1px solid #2b4d3e;border-radius:11px;padding:12px 13px;outline:0}
.box button{margin-top:10px;width:100%;border:0;border-radius:11px;padding:12px;background:var(--green);color:#052114;font-weight:900;cursor:pointer}
@media(max-width:600px){
  .page{padding-top:18px}.top{margin-bottom:40px}.hero{text-align:left}.hero p{font-size:13px}
  .composer{padding:14px;border-radius:20px}.drop{min-height:130px}
}
</style>
</head>
<body>
<div class="page">
  <div class="top">
    <div class="brand">LULIAN AI · VIDEO</div>
    <button id="openAccess" class="smallbtn">员工入口</button>
  </div>

  <section class="hero">
    <h1>把素材丢进来，<br>告诉我你想做什么。</h1>
    <p>参考爆款、客户视频、门店素材、Logo 都可以一起上传。<br>系统会自己理解和分类，不用先填一堆表格。</p>
  </section>

  <main class="composer">
    <label id="drop" class="drop" for="fileInput">
      <div>
        <div class="plus">＋</div>
        <b>上传所有素材</b>
        <span>视频、图片、参考爆款、客户素材一次性丢进来<br>也可以直接拖到这里</span>
      </div>
    </label>
    <input id="fileInput" type="file" accept="video/*,image/*,.zip" multiple>
    <div id="files" class="files"></div>

    <div class="ask">
      <textarea id="brief" placeholder="例如：做一条20秒美容院Meta广告。真人口播为主，前三秒要强Hook，中间穿插真实顾客到店和护理场景，字幕别挡脸，最后引导WhatsApp。"></textarea>
    </div>

    <div class="quick">
      <button class="chip" data-prompt="参考我上传的爆款，重做一条同类型营销视频。真人口播为主，全文语义和画面逐句匹配，真实素材优先，缺镜头再AI补。">参考爆款重做</button>
      <button class="chip" data-prompt="做一条真人口播型广告。前三秒强Hook，中间穿插与台词语义一致的真实B-roll，字幕不要挡脸，结尾明确CTA。">真人口播广告</button>
      <button class="chip" data-prompt="把我上传的真实素材重新剪成一条有营销节奏的短视频。不要随机混剪，每一句声音都要和画面对应。">真实素材混剪</button>
    </div>

    <details class="advanced">
      <summary>＋ 高级设置（可不填）</summary>
      <div class="advbody">
        <div class="field">
          <label>生成几个版本</label>
          <select id="outputCount"><option value="1">1 个版本</option><option value="3">3 个版本</option></select>
        </div>
        <div class="field">
          <label>项目名称</label>
          <input id="projectName" class="text" placeholder="不填也可以，系统自动命名">
        </div>
      </div>
    </details>

    <div class="actions">
      <button id="submitBtn" class="primary">开始做视频</button>
    </div>

    <div id="notice" class="notice">
      <div class="line"><b id="noticeText">准备中…</b><span id="noticePct" class="muted">0%</span></div>
      <div class="progress"><div id="bar" class="bar"></div></div>
    </div>
  </main>

  <details class="history">
    <summary>历史任务</summary>
    <div id="jobs" class="jobs"><div class="empty">登录后显示最近任务。</div></div>
  </details>
</div>

<div id="modal" class="modal">
  <div class="box">
    <h2>员工入口</h2>
    <p>输入内部访问口令。第一次输入后，本次浏览器会记住，不需要每次填写。</p>
    <input id="access" type="password" placeholder="访问口令">
    <button id="loginBtn">进入工作台</button>
  </div>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL='https://ejspsxjeelhsevldmnhl.supabase.co';
const SUPABASE_KEY='sb_publishable_41p3q4WMtJH85KjAPu06fw_JY3UO8XQ';
const FN=SUPABASE_URL+'/functions/v1/video-agent-v0';
const sb=createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);

let selected=[];
const saved=sessionStorage.getItem('lulianVideoAccess')||'';
$('access').value=saved;

function showModal(){ $('modal').classList.add('show') }
function hideModal(){ $('modal').classList.remove('show') }
$('openAccess').onclick=showModal;
$('loginBtn').onclick=async()=>{
  const v=$('access').value.trim();
  if(!v)return;
  sessionStorage.setItem('lulianVideoAccess',v);
  try{await loadJobs();hideModal()}catch(e){alert('口令不正确')}
};
if(!saved)showModal();

async function api(action,body={}){
  const access=sessionStorage.getItem('lulianVideoAccess')||$('access').value.trim();
  if(!access){showModal();throw new Error('请先输入员工访问口令')}
  const r=await fetch(FN,{method:'POST',headers:{'Content-Type':'application/json','x-video-access':access,'apikey':SUPABASE_KEY},body:JSON.stringify({action,...body})});
  const data=await r.json();
  if(!r.ok||data.error)throw new Error(data.error||'请求失败');
  return data;
}

function addFiles(list){
  for(const f of list){
    if(!selected.some(x=>x.name===f.name&&x.size===f.size))selected.push(f);
  }
  renderFiles();
}
function renderFiles(){
  $('files').innerHTML=selected.map((f,i)=>`<div class="file"><span>${f.type.startsWith('video')?'🎬':f.type.startsWith('image')?'🖼️':'📎'}</span><em>${escapeHtml(f.name)}</em><button data-i="${i}">×</button></div>`).join('');
  document.querySelectorAll('.file button').forEach(b=>b.onclick=e=>{e.preventDefault();selected.splice(Number(b.dataset.i),1);renderFiles()});
}
$('fileInput').onchange=e=>addFiles([...e.target.files]);
const drop=$('drop');
['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('drag')}));
['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('drag')}));
drop.addEventListener('drop',e=>addFiles([...e.dataTransfer.files]));

document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{
  const t=$('brief');
  t.value=t.value.trim()?t.value.trim()+'\n'+b.dataset.prompt:b.dataset.prompt;
  t.focus();
});

async function uploadOne(jobId,file,index,total){
  const sign=await api('sign_upload',{job_id:jobId,file_name:file.name,content_type:file.type||'application/octet-stream'});
  const {error}=await sb.storage.from(sign.bucket).uploadToSignedUrl(sign.path,sign.token,file,{contentType:file.type||undefined,upsert:false});
  if(error)throw error;
  const pct=Math.round(((index+1)/Math.max(total,1))*85);
  setStatus('正在上传 '+file.name,pct);
  return {role:'auto',name:file.name,path:sign.path,size:file.size,type:file.type};
}
function setStatus(text,pct){
  $('notice').classList.add('show');$('noticeText').textContent=text;$('noticePct').textContent=pct+'%';$('bar').style.width=pct+'%';
}

$('submitBtn').onclick=async()=>{
  const btn=$('submitBtn');btn.disabled=true;
  try{
    const brief=$('brief').value.trim();
    if(!brief)throw new Error('先告诉我你想做什么');
    const autoName='视频任务 '+new Date().toLocaleDateString()+' '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
    setStatus('正在创建任务…',2);
    const init=await api('init_job',{project_name:$('projectName').value.trim()||autoName,brief,output_count:Number($('outputCount').value)});
    const meta=[];
    for(let i=0;i<selected.length;i++)meta.push(await uploadOne(init.job.id,selected[i],i,selected.length));
    setStatus('素材已上传，交给视频工厂…',93);
    await api('submit_job',{job_id:init.job.id,input_files:meta});
    setStatus('任务已提交',100);
    $('brief').value='';selected=[];renderFiles();
    await loadJobs();
  }catch(e){setStatus('提交失败：'+e.message,0)}finally{btn.disabled=false}
};

const label=s=>({draft:'草稿',uploading:'上传中',queued:'排队中',processing:'制作中',review:'质检中',completed:'已完成',failed:'失败'})[s]||s;
async function loadJobs(){
  const data=await api('list_jobs');
  $('jobs').innerHTML=data.jobs?.length?data.jobs.map(j=>`
    <div class="job">
      <div class="jobhead"><b>${escapeHtml(j.project_name)}</b><span class="pill">${label(j.status)}</span></div>
      <div class="meta">${escapeHtml(j.stage||'')} · ${j.progress||0}% · ${new Date(j.created_at).toLocaleString()}</div>
      <div id="job-${j.id}"><button class="smallbtn detail" data-id="${j.id}" style="margin-top:8px">查看</button></div>
    </div>`).join(''):'<div class="empty">还没有任务。</div>';
  document.querySelectorAll('.detail').forEach(b=>b.onclick=()=>showJob(b.dataset.id));
}
async function showJob(id){
  const root=$('job-'+id);root.innerHTML='<div class="meta">读取中…</div>';
  const {job}=await api('status',{job_id:id});
  let h='<div class="meta">'+escapeHtml(job.stage||'')+' · '+(job.progress||0)+'%</div>';
  if(job.output_files?.length)h+=job.output_files.map((o,i)=>o.url?'<a class="result" target="_blank" href="'+o.url+'">查看成片 '+(i+1)+'</a>':'').join(' ');
  else if(job.status==='failed')h+='<div class="meta" style="color:#ff9a9a">'+escapeHtml(job.error_message||'任务失败')+'</div>';
  else h+='<div class="meta">制作完成后，成片会出现在这里。</div>';
  root.innerHTML=h;
}
function escapeHtml(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
if(saved)loadJobs().catch(()=>showModal());
</script>
</body>
</html>
