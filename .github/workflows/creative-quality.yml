name: Creative quality
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: creative-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  creative-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: All tests including actual media rendering
        run: node --test --test-concurrency=1 tests/*.test.mjs
      - name: Worker module syntax
        run: |
          node --check api/video-worker.mjs
          node --check api/_poster-current-brief.mjs
          node --check api/_poster-copy.mjs
      - run: git diff --exit-code
